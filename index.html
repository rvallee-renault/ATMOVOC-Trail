<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<!-- ATMOVOC TRAIL 1.1 — investigation terrain sur smartphone (compagnon d'ATMOVOC V3.0.28). Aucune donnée réelle dans ce fichier. -->

<title>ATMOVOC TRAIL</title>
<style>:root{--bg:#06101f;--card:#0d1a30;--line:#1f3354;--txt:#eaf3ff;--mut:#8ea6c7;--cy:#25d8ff;--g:#2ee59d;--o:#ffb84d;--r:#ff5a6e;--y:#f1d45a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:18px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 130px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:rgba(6,16,31,.96);margin:calc(-12px - env(safe-area-inset-top)) -14px 12px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}
.top .ttl{font-weight:800;font-size:19px;line-height:1.2}
.back{background:none;border:0;color:var(--cy);font-size:38px;line-height:1;padding:0 8px 4px 0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cy),#7b5cff);display:grid;place-items:center;font-weight:900}
.hero{text-align:center;padding:18px 0 10px}.heroIco{width:76px;height:76px;border-radius:18px;margin-bottom:8px}
.logoBig{font-size:40px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,var(--cy),#9b7cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logoBig span{display:block;font-size:22px;letter-spacing:10px;color:var(--o);-webkit-text-fill-color:var(--o)}
.tag{color:var(--mut);font-style:italic}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card.mini{font-size:15px}.card.memo{border-color:rgba(155,124,255,.6);background:rgba(155,124,255,.1)}
.big{font-size:21px;font-weight:800;margin-bottom:6px}.huge{font-size:48px;font-weight:900;color:var(--cy)}
.muted{color:var(--mut);font-size:15px}.center{text-align:center}
.lab{display:block;font-size:13px;font-weight:800;letter-spacing:.6px;color:var(--mut);margin:14px 0 6px}
.sel,.inp{width:100%;font-size:18px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#071326;color:var(--txt);-webkit-appearance:none;appearance:none}
.ta{min-height:96px;margin-top:10px}
.btn{display:block;width:100%;margin:10px 0;padding:16px;border-radius:16px;border:1px solid var(--line);background:#12233f;color:var(--txt);font-size:18px;font-weight:800}
.btn:active{transform:scale(.98)}.btn.pri{background:linear-gradient(90deg,#0aa5d6,#2f7bff);border:0}
.btn.xl{padding:20px;font-size:20px;margin-top:18px}.btn.sm{padding:10px;font-size:15px}.btn.danger{color:var(--r);border-color:rgba(255,90,110,.4);background:none}
.btn.big2{font-size:17px;padding:22px 8px}
.row,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 8px;text-align:center;font-size:13px;color:var(--mut)}
.cnt div{border-radius:14px;padding:10px 4px;background:#081428}.cnt b{display:block;font-size:34px}
.cnt .r b{color:var(--r)}.cnt .o b{color:var(--o)}.cnt .y b{color:var(--y)}
.kpi{display:flex;gap:8px;margin-bottom:6px}.kpi div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.kpi b{display:block;font-size:24px;color:var(--cy)}.kpi span{font-size:12px;color:var(--mut)}
.sec{font-size:13px;font-weight:900;letter-spacing:.8px;color:var(--mut);margin:20px 0 8px}
.zone{margin:12px 0 18px}.zh{font-weight:900;font-size:17px;margin-bottom:8px}
.enq{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--y);border-radius:16px;padding:14px;margin:8px 0;color:var(--txt);font-size:16px}
.enq.r{border-left-color:var(--r)}.enq.o{border-left-color:var(--o)}.enq.done{opacity:.72}
.et{font-weight:900;font-size:19px}.em{color:var(--mut);font-size:14px;margin:4px 0}.es{font-weight:800;color:var(--cy)}
.es.g{color:var(--g)}.es.o{color:var(--o)}.es.r{color:var(--r)}.es.n{color:var(--mut)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(6,16,31,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
.dock .btn{margin:0;font-size:15px;padding:16px 6px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:12px}
.steps button{background:#0b1830;border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:6px 0;font-weight:900;font-size:17px}
.steps span{display:block;font-size:10px;font-weight:700}.steps .on{border-color:var(--cy);color:var(--cy)}.steps .ok{color:var(--g)}
.zonePill{display:inline-block;background:rgba(37,216,255,.12);border:1px solid rgba(37,216,255,.4);border-radius:999px;padding:4px 12px;font-size:14px;margin-bottom:10px}
.sig{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--y);border-radius:14px;padding:12px;margin:8px 0;font-size:16px}
.sig.r{border-left-color:var(--r)}.sig.o{border-left-color:var(--o)}.sm2{font-size:13px;color:var(--cy);font-weight:800}
.prog{height:8px;background:#0b1830;border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--cy)}
.q .qq{font-size:24px;font-weight:800;line-height:1.3;margin:6px 0 18px}
.ans{display:block;width:100%;margin:10px 0;padding:20px;border-radius:16px;border:0;font-size:22px;font-weight:900;color:#06101f}
.ans.y{background:var(--g)}.ans.n{background:var(--r)}.ans.u{background:#2a3c5c;color:var(--txt);font-size:17px}
.hyp{position:relative;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:6px 0;overflow:hidden;font-size:15px}
.hyp .hb{position:absolute;left:0;top:0;bottom:0;background:rgba(37,216,255,.18)}.hyp span{position:relative}
.hyp.top{border-color:var(--cy);font-weight:800}.hyp.out{opacity:.4;text-decoration:line-through}.hyp em{position:relative;float:right;font-size:12px}
.line{border-bottom:1px solid var(--line);padding:10px 2px;font-size:16px}
.aa{display:inline-block;min-width:44px;text-align:center;border-radius:8px;padding:2px 6px;margin-right:8px;font-weight:900;font-size:13px;color:#06101f}
.aa.y{background:var(--g)}.aa.n{background:var(--r)}.aa.u{background:#8ea6c7}
.chk{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:8px 0;color:var(--txt);font-size:17px}
.chk span{font-size:26px}.chk.on{border-color:var(--g);background:rgba(46,229,157,.1)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat button{padding:16px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--txt);font-size:15px;font-weight:800}
.stat button.on.g{border-color:var(--g)}.stat button.on.o{border-color:var(--o)}.stat button.on.r{border-color:var(--r)}.stat button.on.n{border-color:var(--mut)}
.stat button.on{background:#17305a}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center}.zoom img{max-width:100%;max-height:100%}
.x{float:right;background:none;border:0;color:var(--r);font-size:18px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0;font-weight:800}
.sum .g{color:var(--g)}.sum .o{color:var(--o)}.sum .r{color:var(--r)}.sum .n{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);opacity:0;background:#eaf3ff;color:#06101f;padding:12px 18px;border-radius:999px;font-weight:800;transition:.25s;z-index:50;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script>
/* ===================== PLAYBOOKS D'ENQUÊTE TERRAIN ===================== */
var ZONES = [
  { id: 'MAG', ico: '📦', lab: 'Magasin peinture & FDS' },
  { id: 'CUI', ico: '🧪', lab: 'Cuisine peinture' },
  { id: 'APP', ico: '🎨', lab: 'Application (cabines, robots)' },
  { id: 'PUR', ico: '🧴', lab: 'Purges & nettoyage' },
  { id: 'DEC', ico: '🛢️', lab: 'Déchets & solvants sales' },
  { id: 'AIR', ico: '🔥', lab: 'Traitement d’air' },
  { id: 'BUR', ico: '🗂️', lab: 'Bureau : données & production' }
];
var PB = {
  SOLV: {
    zone: 'PUR', title: 'Purges & nettoyage',
    goal: 'Comprendre pourquoi la consommation de solvants de purge / nettoyage a changé, et si la récupération suit.',
    hyp: {
      H1: 'Changements de teinte / purges plus fréquents',
      H2: 'Nettoyages exceptionnels (arrêt, maintenance, campagne)',
      H3: 'Fuite, égouttures ou vanne de purge défaillante',
      H4: 'Pratiques opérateurs hors procédure (rinçage manuel, double rinçage)',
      H5: 'Récupération des solvants sales dégradée',
      H6: 'Comptabilisation : unité L/kg, livraison groupée, imputation purge ↔ nettoyage'
    },
    q: [
      ['Le nombre de changements de teinte a-t-il augmenté sur la période ?', { H1: 3 }, { H1: -2 }],
      ['Y a-t-il eu des arrêts, maintenances ou campagnes de nettoyage exceptionnelles ?', { H2: 3 }, { H2: -2 }],
      ['Le volume de solvant par purge (robots, cartouches) a-t-il été modifié ?', { H1: 1, H3: 1 }, {}],
      ['Voyez-vous des fuites, égouttures ou vannes de purge qui restent ouvertes ?', { H3: 4 }, { H3: -2 }],
      ['Les opérateurs nettoient-ils au solvant hors procédure (chiffons, seaux, pistolets) ?', { H4: 3 }, { H4: -1 }],
      ['Tous les solvants sales sont-ils collectés vers la cuve de récupération ?', { H5: -2 }, { H5: 4 }],
      ['La quantité déclarée vient-elle d’une sortie magasin / livraison plutôt que d’un comptage ?', { H6: 2 }, { H6: -1 }],
      ['Le produit est-il saisi dans la même unité (kg ou L) que les mois précédents ?', { H6: -1 }, { H6: 4 }],
      ['Le transfert de consommation entre « purge » et « nettoyage » est-il possible (même solvant, deux lignes) ?', { H6: 2 }, {}]
    ],
    checks: ['Observer 3 purges consécutives (durée, volume)', 'Lire le paramétrage purge des robots', 'Contrôler la cuve de solvants sales (niveau, collecte)', 'Vérifier les procédures de nettoyage affichées', 'Comparer bon de sortie magasin et quantité déclarée'],
    meas: [['Changements de teinte / équipe', ''], ['Solvant par purge', 'L'], ['Niveau cuve solvants sales', '%'], ['Sortie magasin du mois', 'kg']],
    proofs: ['Écran paramétrage purge', 'Cuve / compteur', 'Procédure affichée']
  },
  PROD: {
    zone: 'APP', title: 'Consommation de produit',
    goal: 'Vérifier si l’écart de consommation est réel (process) ou comptable (saisie, stock).',
    hyp: {
      H1: 'Rendement de transfert dégradé (robots, buses, électrostatique)',
      H2: 'Épaisseurs augmentées ou retouches plus nombreuses',
      H3: 'Mix véhicules / teintes différent',
      H4: 'Livraison groupée ou variation de stock non lissée',
      H5: 'Erreur de saisie (unité, double ligne, mauvais produit)',
      H6: 'Ligne manquante ou consommation reportée sur un autre mois'
    },
    q: [
      ['La consommation déclarée est-elle mesurée au point d’utilisation (compteur, pesée) ?', { H4: -2, H5: -1 }, { H4: 3 }],
      ['Les réglages robots (débit, haute tension, trajectoires) ont-ils changé ?', { H1: 3 }, { H1: -1 }],
      ['Les mesures d’épaisseur ou le taux de retouche ont-ils augmenté ?', { H2: 3 }, { H2: -1 }],
      ['Le mix modèles / teintes a-t-il sensiblement changé ce mois ?', { H3: 3 }, { H3: -1 }],
      ['Une livraison importante a-t-elle eu lieu en fin ou début de mois ?', { H4: 3 }, {}],
      ['Le produit apparaît-il sur deux lignes du bilan (doublon possible) ?', { H5: 4 }, { H5: -1 }],
      ['Le stock physique au magasin est-il cohérent avec le stock théorique ?', { H4: -1 }, { H4: 2, H6: 2 }]

    checks: ['Relever le stock physique du produit', 'Vérifier les réglages robots / applicateurs', 'Consulter les mesures d’épaisseur', 'Consulter le relevé de retouches', 'Contrôler les bons de livraison du mois'],
    meas: [['Stock physique', 'kg'], ['Épaisseur moyenne', 'µm'], ['Taux de retouche', '%']],
    proofs: ['Étiquette du fût', 'Écran réglages robot', 'Bon de livraison']
  },
  SUBST: {
    zone: 'MAG', title: 'Produit nouveau ou disparu',
    goal: 'Confirmer une substitution de produit ou détecter une ligne oubliée.',
    hyp: {
      H1: 'Substitution réelle de produit',
      H2: 'Changement de process (nouvelle étape, nouveau fournisseur)',
      H3: 'Ligne oubliée dans le bilan / l’import',
      H4: 'Produit renommé (même produit, autre libellé)'

      ['Une validation de substitution (homologation, essais) existe-t-elle ?', { H1: 3 }, {}],
      ['La référence fournisseur est-elle identique entre ancien et nouveau libellé ?', { H4: 4 }, { H4: -2 }],

      ['La ligne regroupe-t-elle plusieurs produits (« Divers », « Retouches ») ?', { H5: 4 }, { H5: -2 }],
      ['La valeur de la bibliothèque correspond-elle à la FDS en vigueur ?', { H4: -2 }, { H4: 4 }]
    ],
    checks: ['Photographier l’étiquette du fût en stock', 'Récupérer la FDS en vigueur (section 9 – COV)', 'Noter la date de révision de la FDS', 'Comparer avec la valeur de la bibliothèque'],
    meas: [['% COV selon FDS', '%'], ['Date de révision FDS', ''], ['Densité', 'kg/L']],
    proofs: ['Étiquette du fût', 'FDS section 9']
  },
  OUT: {
    zone: 'DEC', title: 'Sorties : déchets & solvants sales',
    goal: 'Vérifier que les sorties déclarées (masse et % COV) reflètent les enlèvements réels.',
    hyp: {
      H1: 'Enlèvement exceptionnel (curage, vidange de cuve)',
      H2: 'Nouvelle analyse du % COV du déchet',
      H3: 'Enlèvement non saisi ou décalé d’un mois',
      H4: 'Erreur d’unité ou de % COV sur le déchet',
      H5: 'Filière de récupération modifiée (prestataire, régénération)'

      ['Les bordereaux (BSD) du mois correspondent-ils aux quantités déclarées ?', { H3: -2, H4: -2 }, { H3: 3, H4: 2 }],
      ['Un curage ou une vidange exceptionnelle a-t-il eu lieu ?', { H1: 4 }, { H1: -2 }],
      ['Une nouvelle analyse de laboratoire du déchet a-t-elle été reçue ?', { H2: 4 }, { H2: -1 }],
      ['Un enlèvement prévu a-t-il été reporté au mois suivant ?', { H3: 3 }, {}],
      ['Le prestataire ou la filière (régénération, incinération) a-t-il changé ?', { H5: 4 }, { H5: -1 }]

    checks: ['Consulter les BSD / bordereaux du mois', 'Lire la dernière analyse labo des solvants sales', 'Relever le niveau des cuves de déchets', 'Vérifier le registre déchets'],
    meas: [['Quantité enlevée (BSD)', 'kg'], ['% COV analyse labo', '%'], ['Niveau cuve', '%']],
    proofs: ['Bordereau BSD', 'Rapport d’analyse', 'Cuve / zone déchets']
  },
  INC: {
    zone: 'AIR', title: 'Traitement d’air / incinération',
    goal: 'Comprendre la variation de la quantité de COV détruits.',

      ['L’équipement déclaré dans ATMOVOC correspond-il à l’installation réelle ?', { H5: -2 }, { H5: 5 }]

    proofs: ['Supervision oxydateur', 'Journal by-pass']
  },
  CONSO: {
    zone: 'CUI', title: 'Consommation vs production',

    hyp: {
      H1: 'Production sous-déclarée ou incomplète',

      H3: 'Consommation réellement accrue (purges, nettoyage, retouches)',

    q: [

  DATA: {

      '<div class="grid2"><div><label class="lab">PILOTE</label><input class="inp" value="' + esc(st.owner) + '" onchange="setF(\'' + eid + '\',\'owner\',this.value)"></div><div><label class="lab">ÉCHÉANCE</label><input type="date" class="inp" value="' + esc(st.due) + '" onchange="setF(\'' + eid + '\',\'due\',this.value)"></div></div>' +
      '<button class="btn pri xl" onclick="if(!enqState(\'' + eid + '\').status){toast(\'Choisissez un statut\');return;}save();toast(\'Enquête enregistrée\');go(\'site\')">✔ ENREGISTRER L’ENQUÊTE</button>';
    save();
  }
  return h;
}
function hypBlock(e) {
  var R = hypRank(e), mx = Math.max(1, R[0] ? R[0].s : 1), any = R.some(function (r) { return r.s !== 0; });
  return '<div class="sec">HYPOTHÈSES' + (any ? ' — LA PLUS PROBABLE EN TÊTE' : '') + '</div>' + R.map(function (r, i) {
    var w = r.s > 0 ? Math.round(r.s / mx * 100) : 0;
    return '<div class="hyp' + (i === 0 && r.s > 0 ? ' top' : '') + (r.s < 0 ? ' out' : '') + '"><div class="hb" style="width:' + w + '%"></div><span>' + esc(r.label) + '</span>' + (r.s < 0 ? '<em>écartée</em>' : '') + '</div>';
  }).join('');
}
function answer(id, i, a) { vibrate(); var st = enqState(id); if (a) st.answers[i] = a; else delete st.answers[i]; save(); render(); }
function toggleCheck(id, i) { vibrate(); var st = enqState(id); st.checks[i] = !st.checks[i]; save(); render(); }
function setMeas(id, i, v) { enqState(id).meas[i] = v; save(); }
function setF(id, f, v) { enqState(id)[f] = v; save(); }
function addNote(id) { var t = $('note').value.trim(); if (!t) return; enqState(id).notes.push(t); save(); render(); toast('Observation ajoutée'); }
function delNote(id, i) { enqState(id).notes.splice(i, 1); save(); render(); }

/* ---------- 3. Observation libre ---------- */
var OBS = { type: 'Anomalie', zone: 'APP', photos: [] };
function vObs() {
  var h = topbar('Je vois quelque chose', "go('site')");
  h += '<div class="sec">TYPE</div><div class="stat">' + FREE_TYPES.map(function (t) { return '<button class="' + (OBS.type === t[1] ? 'on g' : '') + '" onclick="OBS.type=\'' + t[1] + '\';render()">' + t[0] + '<br>' + t[1] + '</button>'; }).join('') + '</div>' +
    '<label class="lab">ZONE</label><select class="sel" onchange="OBS.zone=this.value">' + ZONES.map(function (z) { return '<option value="' + z.id + '"' + (OBS.zone === z.id ? ' selected' : '') + '>' + z.ico + ' ' + esc(z.lab) + '</option>'; }).join('') + '</select>' +
    '<div class="grid2"><button class="btn big2" onclick="takePhoto(null)">📷<br>PHOTO' + (OBS.photos.length ? ' (' + OBS.photos.length + ')' : '') + '</button><button class="btn big2" onclick="dictate(\'otext\')">🎤<br>DICTER</button></div>' +
    '<textarea id="otext" class="inp ta" placeholder="Décrivez ce que vous voyez…"></textarea>' +
    '<button class="btn pri xl" onclick="saveObs()">✔ ENREGISTRER</button>';
  var v = visit(); if (v.obs.length) h += '<div class="sec">DÉJÀ NOTÉES</div>' + v.obs.map(function (o) { return '<div class="line">' + esc(o.type) + ' · ' + esc(zoneOf(o.zone).lab) + ' — ' + esc(o.text) + (o.photos.length ? ' 📷' + o.photos.length : '') + '</div>'; }).join('');
  return h;
}
function saveObs() { var t = $('otext').value.trim(); if (!t && !OBS.photos.length) { toast('Ajoutez un texte ou une photo'); return; } visit().obs.push({ type: OBS.type, zone: OBS.zone, text: t, photos: OBS.photos, at: new Date().toISOString() }); OBS = { type: 'Anomalie', zone: OBS.zone, photos: [] }; save(); toast('Observation enregistrée'); go('site'); }

/* ---------- 4. Photos (IndexedDB, compressées) & dictée ---------- */
var DB = null;
function db() { return DB ? Promise.resolve(DB) : new Promise(function (res, rej) { var r = indexedDB.open('atmovoc_trail', 1); r.onupgradeneeded = function () { r.result.createObjectStore('photos'); }; r.onsuccess = function () { DB = r.result; res(DB); }; r.onerror = function () { rej(r.error); }; }); }
function putPhoto(id, data) { return db().then(function (d) { return new Promise(function (res) { var t = d.transaction('photos', 'readwrite'); t.objectStore('photos').put(data, id); t.oncomplete = res; }); }); }
function getPhoto(id) { return db().then(function (d) { return new Promise(function (res) { var r = d.transaction('photos').objectStore('photos').get(id); r.onsuccess = function () { res(r.result); }; r.onerror = function () { res(null); }; }); }); }
function takePhoto(enqId) {
  var i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.setAttribute('capture', 'environment');
  i.onchange = function () {
    var f = i.files && i.files[0]; if (!f) return; var img = new Image(), u = URL.createObjectURL(f);
    img.onload = function () {
      var k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      var data = c.toDataURL('image/jpeg', 0.72), id = 'p' + Date.now();
      putPhoto(id, data).then(function () { if (enqId) { enqState(enqId).photos.push(id); } else OBS.photos.push(id); save(); toast('Photo enregistrée'); render(); });
    };
    img.src = u;
  };
  i.click();
}
function loadThumbs() {
  var e = findEnq(VIEW.enq), box = $('thumbs'); if (!e || !box) return; var st = enqState(e.id);
  st.photos.forEach(function (id) { getPhoto(id).then(function (d) { if (d) { var im = document.createElement('img'); im.src = d; im.onclick = function () { showPhoto(d); }; box.appendChild(im); } }); });
}
function showPhoto(d) { var o = document.createElement('div'); o.className = 'zoom'; o.innerHTML = '<img src="' + d + '">'; o.onclick = function () { o.remove(); }; document.body.appendChild(o); }
function dictate(target) {
  var R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) { toast('Touchez le micro 🎤 du clavier pour dicter'); $(target).focus(); return; }
  try {
    var r = new R(); r.lang = 'fr-FR'; r.interimResults = false; toast('🎤 Je vous écoute…');
    r.onresult = function (ev) { var t = ev.results[0][0].transcript, el = $(target); el.value = (el.value ? el.value + ' ' : '') + t; };
    r.onerror = function () { toast('Touchez le micro 🎤 du clavier pour dicter'); $(target).focus(); };
    r.start();
  } catch (e) { toast('Touchez le micro 🎤 du clavier pour dicter'); $(target).focus(); }
}

/* ---------- 5. Fin de visite : synthèse, export, partage ---------- */
function report() {
  var v = visit(), E = buildEnquetes(S.site);
  return {
    format: 'ATMOVOC_TRAIL_VISITE_V1', trail: TRAIL_VERSION, id: v.id, site: S.site, date: v.date, auteur: S.auteur, packGeneratedAt: S.pack.generatedAt, exportedAt: new Date().toISOString(),
    enquetes: E.filter(function (e) { return v.enq[e.id] && (v.enq[e.id].status || Object.keys(v.enq[e.id].answers).length); }).map(function (e) {
      var st = v.enq[e.id], pb = PB[e.pb], R = hypRank(e);
      var constats = pb.checks.filter(function (c, i) { return st.checks[i]; }).map(function (c) { return 'Vérifié : ' + c; })
        .concat(pb.meas.map(function (m, i) { return st.meas[i] ? m[0] + ' = ' + st.meas[i] + (m[1] ? ' ' + m[1] : '') : null; }).filter(Boolean)).concat(st.notes);
      return { title: e.title, zone: zoneOf(e.zone).lab, playbook: e.pb, status: st.status || 'encours', cause: st.cause, action: st.action, owner: st.owner, due: st.due,
        hypotheses: R.map(function (r) { return { label: r.label, score: r.s }; }), reponses: pb.q.map(function (q, i) { return st.answers[i] ? { q: q[0], r: st.answers[i] } : null; }).filter(Boolean),
        constats: constats, photos: st.photos.slice(), sigs: e.anomalies.map(function (a) { return a.sig; }),
        anomalies: e.anomalies.map(function (a) { return { site: a.site, month: a.month, cat: a.cat, sev: a.sev, title: a.title, detail: a.detail }; }) };
    }),
    observations: v.obs.map(function (o) { return { type: o.type, zone: zoneOf(o.zone).lab, text: o.text, nPhotos: o.photos.length, at: o.at }; })
  };
}
function vEnd() {
  var R = report(), c = { identifiee: 0, probable: 0, poursuivre: 0, faux: 0, encours: 0 }; R.enquetes.forEach(function (e) { c[e.status]++; });
  var total = buildEnquetes(S.site).length;
  var h = topbar('Fin de visite', "go('site')") + '<div class="card center"><div class="big">' + esc(S.site) + ' · ' + esc(R.date) + '</div><div class="huge">' + R.enquetes.length + ' / ' + total + '</div><div class="muted">enquêtes menées</div></div>' +
    '<div class="sum"><div class="g">✅ ' + c.identifiee + ' cause(s) identifiée(s)</div><div class="o">🟠 ' + c.probable + ' cause(s) probable(s)</div><div class="r">🔴 ' + (c.poursuivre + c.encours) + ' à poursuivre</div><div class="n">⚪ ' + c.faux + ' faux signal(aux)</div><div>👁 ' + R.observations.length + ' observation(s) libre(s)</div></div>';
  R.enquetes.forEach(function (e) { var s = STATUS[e.status]; h += '<div class="line"><b>' + esc(e.title) + '</b><br>' + (s ? s[0] + ' ' + s[1] : '… en cours') + (e.cause ? ' — ' + esc(e.cause) : '') + (e.action ? '<br>➜ ' + esc(e.action) + (e.owner ? ' (' + esc(e.owner) + ')' : '') : '') + '</div>'; });
  h += '<button class="btn pri xl" onclick="exportReport()">💾 EXPORTER LE COMPTE RENDU</button><div class="muted center">Enregistrer dans OneDrive, puis ATMOVOC PC › VOC Intelligence › 📥 Visites TRAIL</div>' +
    '<button class="btn" onclick="shareText()">✉️ PARTAGER LA SYNTHÈSE</button><button class="btn" onclick="sharePhotos()">📷 PARTAGER LES PHOTOS</button>' +
    '<button class="btn danger" onclick="closeVisit()">🗑 CLÔTURER ET EFFACER CETTE VISITE</button>';
  return h;
}
function exportReport() {
  var R = report(), b = new Blob([JSON.stringify(R, null, 1)], { type: 'application/json' }), name = 'ATMOVOC_TRAIL_VISITE_' + S.site.replace(/[^A-Za-z0-9]+/g, '_') + '_' + R.date + '.json';
  var f = null; try { f = new File([b], name, { type: 'application/json' }); } catch (e) {}
  if (f && navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: name }).catch(function (e) { if (!e || e.name !== 'AbortError') dl(b, name); }); return; }
  dl(b, name);
}
function dl(b, name) { var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); toast('Fichier enregistré'); }
function synthText() {
  var R = report(), t = 'ATMOVOC TRAIL — visite ' + R.site + ' du ' + R.date + (R.auteur ? ' (' + R.auteur + ')' : '') + '\n\n';
  R.enquetes.forEach(function (e, i) { var s = STATUS[e.status]; t += (i + 1) + '. ' + e.title + ' — ' + (s ? s[1] : 'en cours') + '\n' + (e.cause ? '   Cause : ' + e.cause + '\n' : '') + (e.action ? '   Action : ' + e.action + (e.owner ? ' — ' + e.owner : '') + (e.due ? ' (échéance ' + e.due + ')' : '') + '\n' : '') + (e.constats.length ? '   Constats : ' + e.constats.join(' ; ') + '\n' : '') + '\n'; });
  if (R.observations.length) { t += 'Observations libres :\n'; R.observations.forEach(function (o) { t += ' - [' + o.type + ' · ' + o.zone + '] ' + o.text + '\n'; }); }
  return t;
}
function shareText() { var t = synthText(); if (navigator.share) navigator.share({ title: 'Visite ATMOVOC TRAIL ' + S.site, text: t }).catch(function () {}); else location.href = 'mailto:?subject=' + encodeURIComponent('ATMOVOC TRAIL | ' + S.site + ' | visite du ' + visit().date) + '&body=' + encodeURIComponent(t); }
function sharePhotos() {
  var v = visit(), ids = []; Object.keys(v.enq).forEach(function (k) { ids = ids.concat(v.enq[k].photos); }); v.obs.forEach(function (o) { ids = ids.concat(o.photos); });
  if (!ids.length) { toast('Aucune photo'); return; }
  Promise.all(ids.map(getPhoto)).then(function (L) {
    var files = L.filter(Boolean).map(function (d, i) { var bin = atob(d.split(',')[1]), u = new Uint8Array(bin.length); for (var j = 0; j < bin.length; j++) u[j] = bin.charCodeAt(j); return new File([u], 'TRAIL_' + S.site.replace(/\W+/g, '_') + '_' + (i + 1) + '.jpg', { type: 'image/jpeg' }); });
    if (navigator.canShare && navigator.canShare({ files: files })) navigator.share({ files: files, title: 'Photos visite ' + S.site }).catch(function () {});
    else files.forEach(function (f) { dl(f, f.name); });
  });
}
function closeVisit() { if (!confirm('Avez-vous bien exporté le compte rendu ? La visite sera effacée du téléphone.')) return; delete S.visits[S.site]; save(); go('home'); }
function vHist() {
  var P = S.pack, h = topbar('Historique', "go('home')"), H = (P.history || []).filter(function (r) { return !S.site || r.site === S.site; });
  if (!H.length) h += '<div class="card center muted">Aucune visite antérieure dans le pack' + (S.site ? ' pour ' + esc(S.site) : '') + '.</div>';
  H.forEach(function (r) { h += '<div class="card"><b>' + esc(r.site) + ' · ' + esc(r.date) + '</b>' + (r.enquetes || []).map(function (e) { var s = STATUS[e.status]; return '<div class="line">' + (s ? s[0] : '…') + ' ' + esc(e.title) + (e.cause ? ' — ' + esc(e.cause) : '') + '</div>'; }).join('') + '</div>'; });
  var res = (P.resolved || []).filter(function (a) { return !S.site || a.site === S.site; });
  if (res.length) h += '<div class="sec">ÉCARTS DÉJÀ RÉSOLUS DANS ATMOVOC</div>' + res.map(function (a) { return '<div class="line">✓ ' + mlab(a.month) + ' · ' + esc(a.title) + (a.note ? ' — ' + esc(a.note) : '') + '</div>'; }).join('');
  return h;
}

/* ---------- 6. Chargement du pack ---------- */
function pickPack() {
  var i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json,text/plain';
  i.onchange = function () {
    var f = i.files && i.files[0]; if (!f) return; var rd = new FileReader();
    rd.onload = function () {
      var p; try { p = JSON.parse(rd.result); } catch (e) { toast('Fichier illisible'); return; }
      if (!p || p.format !== 'ATMOVOC_TRAIL_PACK_V1') { toast('Ce fichier n’est pas un pack TRAIL'); return; }
      S.pack = p; S.packName = f.name; if (S.site && !packHasSite(S.site)) S.site = ''; save(); toast('Pack chargé : ' + (p.anomalies || []).length + ' écarts'); go('home');
    };
    rd.readAsText(f);
  };
  i.click();
}
function packHasSite(s) { return (S.pack.sites || []).some(function (x) { return x.site === s; }) || (S.pack.anomalies || []).some(function (a) { return a.site === s; }); }
function loadDemo() { S.pack = DEMO_PACK; S.packName = 'DÉMO — site fictif, chiffres inventés'; S.site = 'Site Démo'; save(); go('home'); }

/* ---------- 7. Démarrage + mode hors connexion ---------- */
window.addEventListener('load', function () {
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
});

</script></body></html>
